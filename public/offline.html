<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Offline | Bin'Go Smart Waste Collection</title>
  <link rel="icon" href="/icon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #fafafa;
      background-image: url('/hero-bg.svg');
      background-repeat: no-repeat;
      background-position: top center;
      background-size: 100% auto;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    @media (min-width: 640px) {
      body {
        background-size: cover;
        background-position: center;
      }
    }
    .brand-logo {
      height: 44px;
      width: auto;
      object-fit: contain;
      margin-bottom: 24px;
      mix-blend-mode: multiply;
    }
    .card {
      background-color: #ffffff;
      border: 1px solid #f4f4f5;
      border-radius: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: #fff1f2;
      border: 1px solid #ffe4e6;
      color: #e11d48;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 20px;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #e11d48;
      box-shadow: 0 0 0 2px rgba(225, 29, 72, 0.2);
    }
    .icon-wrapper {
      color: #059669;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background-color: #ecfdf5;
      border: 1px solid #d1fae5;
      box-shadow: 0 4px 12px -2px rgba(5, 150, 105, 0.12);
    }
    .icon-wrapper svg {
      width: 32px;
      height: 32px;
    }
    h1 {
      font-size: 22px;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #ecfdf5;
      border-top-color: #059669;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>

  <script>
    window.addEventListener('online', () => {
      window.location.reload();
    });
    
    // Fallback: poll to see if connection is restored
    setInterval(() => {
      if (navigator.onLine) {
        fetch(window.location.href, { method: 'HEAD' })
          .then(() => window.location.reload())
          .catch(() => {});
      }
    }, 5000);
  </script>
</body>
</html>
