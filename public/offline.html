<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Offline | Bin'Go Smart Waste Collection</title>
  <link rel="icon" href="/icon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #fafafa;
      color: #18181b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e4e4e7;
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .icon-wrapper {
      width: 72px;
      height: 72px;
      background-color: #ecfdf5;
      color: #059669;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .icon-wrapper svg {
      width: 36px;
      height: 36px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 14px;
      color: #71717a;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      background-color: #059669;
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
    }
    .btn:active {
      transform: scale(0.98);
      background-color: #047857;
    }
    .tip {
      margin-top: 20px;
      font-size: 12px;
      color: #a1a1aa;
      border-top: 1px solid #f4f4f5;
      padding-top: 16px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.828-6.364 9 9 0 012.828-6.364m2.828 2.828a5 5 0 00-1.414 3.536c0 1.38.56 2.63 1.414 3.536m0 0L3 3" />
      </svg>
    </div>
    <h1>You're Currently Offline</h1>
    <p>Bin'Go couldn't reach the live network. Any reports you submit while offline will sync once your connection returns.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    <div class="tip">
      Check your mobile data or Wi-Fi settings to resume live garbage truck tracking.
    </div>
  </div>
</body>
</html>
