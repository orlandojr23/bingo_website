<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Offline | Bin'Go Smart Waste Collection</title>
  <link rel="icon" href="/icon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #fafafa;
      background-image: url('/hero-bg.svg');
      background-repeat: no-repeat;
      background-position: top center;
      background-size: 100% auto;
      color: #09090b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    @media (min-width: 640px) {
      body {
        background-size: cover;
        background-position: center;
      }
    }
    .icon-wrapper {
      color: #059669;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background-color: #ecfdf5;
      border: 1px solid #d1fae5;
    }
    .icon-wrapper svg {
      width: 28px;
      height: 28px;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      color: #09090b;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    p {
      font-size: 13px;
      color: #71717a;
      line-height: 1.5;
      max-width: 320px;
      margin-bottom: 20px;
    }
    .btn {
      background-color: #059669;
      color: #ffffff;
      font-weight: 600;
      font-size: 13px;
      padding: 10px 24px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(5, 150, 105, 0.2);
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn:hover {
      background-color: #047857;
    }
    .btn:active {
      transform: scale(0.98);
      background-color: #047857;
    }
  </style>
</head>
<body>
  <div class="icon-wrapper">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.828-6.364 9 9 0 012.828-6.364m2.828 2.828a5 5 0 00-1.414 3.536c0 1.38.56 2.63 1.414 3.536m0 0L3 3" />
    </svg>
  </div>
  <h1>You're Offline</h1>
  <p>Check your internet connection, then try again.</p>
  <button class="btn" onclick="window.location.reload()">Retry</button>
</body>
</html>
